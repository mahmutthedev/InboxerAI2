version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      QDRANT_URL: http://qdrant:6333
    env_file:
      - ./.env
    depends_on:
      - qdrant
    volumes:
      - ./data:/app/data
    command: ["npm", "run", "start"]

  qdrant:
    image: qdrant/qdrant:v1.9.0
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_state:/qdrant/storage
